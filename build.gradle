plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.6.1'
    implementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.0.1'
    implementation 'io.cucumber:cucumber-testng:7.33.0'
    implementation 'io.cucumber:cucumber-core:7.33.0'
    implementation 'io.cucumber:cucumber-java:7.33.0'
    implementation 'io.cucumber:gherkin:37.0.1'
}

test {
    useTestNG() {

        suites "src/test/resources/TestNG.xml"
        systemProperty("browser", System.getProperty("browser"))
    }
}